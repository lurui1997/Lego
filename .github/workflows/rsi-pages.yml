name: Deploy RSI site

on:
  push:
    branches: [main]
    paths:
      - experiments/rsi-agent/**
      - .github/workflows/rsi-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rsi-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export site data
        run: node src/export-site.js
        working-directory: experiments/rsi-agent
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/rsi-agent/web
      - id: deployment
        uses: actions/deploy-pages@v4
